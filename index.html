<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d28d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AM Associates Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">AM</div>
        <div>
          <div class="brand-name" id="brand-name">AM Associates</div>
          <div class="brand-sub" id="brand-sub">Dr. Meraj Ahamed, MBBS</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a href="#/settings" class="nav-link" data-page="settings"><span class="nav-ico">⚙️</span><span>Settings &amp; Backup</span></a>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <form class="search" id="global-search">
          <span>🔍</span>
          <input type="search" id="global-q" placeholder="Search patient by name, phone or ID…" autocomplete="off" />
        </form>
        <button class="btn btn-primary" data-act="add" data-type="patients">＋ New Patient</button>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-box" id="modal-box">
      <div class="modal-head" id="modal-head">
        <h3 id="modal-title"></h3>
        <button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="modal-form" autocomplete="off">
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-light" data-act="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="datalists" hidden></div>
  <div id="print-area"></div>

  <script src="js/app.js"></script>
</body>
</html>
